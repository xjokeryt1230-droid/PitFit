name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  crypto: ^3.0.8
  cryptography: ^2.9.0
